<html lang="zh-CN">

  <title>64 重思想实验 · 精神档案馆</title>
  <style>:root {
  color-scheme: dark;
  --bg: #111010;
  --paper: #eee4d1;
  --muted: #aea293;
  --brass: #d3bd90;
  --rust: #b77159;
  --line: #40372e;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--paper); background: radial-gradient(ellipse at 68% 23%, #221c18 0, transparent 55%), var(--bg); font: 15px/1.65 var(--sans); }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; }
a { color: var(--brass); }
h1, h2, h3, p, blockquote { margin: 0; }
h1, h2, h3, blockquote { font-family: var(--serif); }
svg { vertical-align: middle; }
img { display: block; max-width: 100%; }
.frame { position: relative; display: flex; flex-direction: column; width: min(100%, 1100px); min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 0 max(26px, env(safe-area-inset-right)) 0 max(26px, env(safe-area-inset-left)); }
.masthead, .footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); }
.masthead { min-height: 72px; padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
.wordmark { display: flex; gap: 10px; align-items: center; color: var(--brass); font: 600 16px var(--serif); letter-spacing: .12em; }
.masthead-side, .footer { font-size: 11px; letter-spacing: .15em; }
.footer { min-height: 56px; padding-bottom: env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--line); }
#app { flex: 1; display: flex; flex-direction: column; }
.kicker { color: var(--brass); font-size: 11px; font-weight: 600; letter-spacing: .19em; }
.eyebrow-line { display: flex; align-items: center; gap: 11px; }
.eyebrow-line::before { content: ""; display: block; width: 25px; height: 1px; background: var(--rust); }
.hero { flex: 1; display: grid; grid-template-columns: .98fr 1.02fr; align-items: center; gap: 48px; padding: 44px 0 54px; }
.hero h1 { margin: 17px 0 21px; font-weight: 650; font-size: clamp(42px, 5.7vw, 73px); line-height: 1.105; letter-spacing: -.055em; }
.hero h1 em { color: var(--brass); font-style: normal; }
.hero .lead { color: var(--muted); font-size: 14px; line-height: 1.9; max-width: 40em; }
.hero .invocation { margin-top: 14px; font: 17px/1.75 var(--serif); color: var(--paper); }
.art-orbit { display: grid; place-items: center; min-width: 0; position: relative; }
.art-orbit > * { grid-area: 1 / 1; }
.art-orbit::before { content: ""; grid-area: 1 / 1; width: 86%; aspect-ratio: 1; background: radial-gradient(circle, #9f644329, transparent 68%); pointer-events: none; }
.hero-art { width: min(100%, 465px); margin: auto; }
.hero-art svg { position: relative; }
.facts { display: flex; flex-wrap: wrap; gap: 7px 16px; align-items: center; margin: 23px 0 16px; color: var(--muted); font-size: 12px; }
.facts span + span::before { content: "·"; margin-right: 16px; color: var(--brass); }
.btn { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 10px; padding: 10px 19px; border: 1px solid var(--line); background: #211b17; color: var(--paper); text-decoration: none; text-align: center; font-weight: 600; line-height: 1.35; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
.btn:hover { background: #31271e; border-color: #7e694e; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: #d4bf93; border-color: #d4bf93; color: #201710; }
.btn.primary:hover { background: #ead5ac; border-color: #ead5ac; }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .primary { min-width: 210px; justify-content: space-between; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.65; }
.hero .hint { margin-top: 12px; }
.quiz { flex: 1; display: grid; grid-template-columns: minmax(200px, .76fr) minmax(0, 1.24fr); align-items: center; gap: clamp(28px, 6vw, 78px); padding: 30px 0 39px; }
.quiz-art { width: min(100%, 380px); margin: auto; }
.quiz-stage { min-width: 0; }
.progress-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
.progress-label strong { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--brass); letter-spacing: .1em; }
.segments { height: 4px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 25px; }
.segment { background: #342a24; overflow: hidden; }
.segment span { display: block; height: 100%; background: var(--brass); transition: width .25s ease; }
.question { font-size: clamp(21px, 2.55vw, 31px); font-weight: 600; line-height: 1.45; }
.question-index { margin-bottom: 7px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
.options { display: grid; gap: 8px; margin-top: 18px; }
.choice { display: grid; grid-template-columns: 19px 1fr; gap: 10px; text-align: left; align-items: baseline; width: 100%; min-height: 47px; padding: 10px 12px; border: 1px solid var(--line); background: #191614e0; font-size: 14px; line-height: 1.53; }
.choice span:first-child { font-family: Georgia, serif; font-size: 13px; color: var(--brass); }
.choice:hover, .choice.chosen { border-color: #9f8259; background: #33281e; }
.quiz-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.text-btn { min-height: 44px; border: 0; padding: 6px 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; font-size: 12px; }
.text-btn:hover { color: var(--paper); }
.reveal { padding: 14px 0; }
.reveal h2 { font-weight: 600; font-size: clamp(28px, 4.2vw, 46px); line-height: 1.28; margin: 11px 0 12px; }
.reveal p:not(.kicker) { font: 17px/1.75 var(--serif); color: var(--muted); margin-bottom: 22px; }
.reveal .next-chapter { margin-top: -11px; font: 12px/1.6 var(--sans) !important; }
.compute { flex: 1; display: grid; align-content: center; justify-items: center; text-align: center; padding: 24px 0 46px; min-height: 450px; }
.compute svg { width: min(68vw, 330px); }
.compute h1 { font-size: clamp(26px, 5vw, 39px); margin: 7px 0 4px; }
.compute p { color: var(--muted); }
.result { width: min(100%, 790px); margin: 0 auto; padding: 30px 0 40px; }
.result-card { display: grid; grid-template-columns: 1fr minmax(170px, .62fr); align-items: center; gap: 21px; padding: 25px 27px; border: 1px solid #62513d; background: linear-gradient(145deg, #2b211a, #171312 65%); }
.result-card h1 { font-size: clamp(33px, 5vw, 52px); font-weight: 650; line-height: 1.15; margin: 8px 0 11px; }
.result-card blockquote { border-left: 1px solid var(--rust); padding-left: 11px; margin-bottom: 11px; color: var(--brass); font-size: 17px; line-height: 1.55; }
.result-card .profile { color: var(--muted); font-size: 14px; }
.result-actions { margin-top: 13px; }
.premium { position: relative; margin-top: 30px; padding-top: 21px; border-top: 1px solid var(--line); }
.premium-head { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
.premium h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 600; }
.seal { width: 72px; flex: none; }
.seal svg { width: 100%; height: auto; }
.modules { display: grid; gap: 8px; margin-top: 11px; }
.module { padding: 14px 16px; background: #241c17bf; border: 1px solid var(--line); }
.module h3 { font-size: 16px; font-weight: 600; line-height: 1.5; }
.module p { color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.locked-noise { overflow: hidden; height: 25px; filter: blur(3px); opacity: .6; user-select: none; white-space: nowrap; }
.locked .module { background: #2f241b85; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.unlock-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 15px; }
.archive { margin-top: 20px; padding: 15px; border: 1px solid var(--line); }
.archive details { margin-top: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.archive summary { color: var(--brass); cursor: pointer; }
.archive ol { padding-left: 22px; }
.archive li { margin: 9px 0; }
.archive li p { color: var(--muted); }
.archive .action-row { margin-top: 11px; }
.wall-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 11px; }
.wall-list button { min-height: 43px; padding: 7px 5px; }
.result-footer { margin-top: 12px; }
.overlay { position: fixed; z-index: 10; inset: 0; display: grid; align-items: center; justify-items: center; padding: 17px; background: #080606d9; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overscroll-behavior: contain; }
.sheet { position: relative; width: min(100%, 470px); max-height: 92vh; max-height: 92dvh; overflow: auto; overscroll-behavior: contain; padding: 22px; border: 1px solid #675540; background: #201914; }
.sheet h2 { font-size: 26px; line-height: 1.3; margin: 4px 45px 9px 0; }
.sheet .close { position: absolute; top: 9px; right: 10px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 23px; color: var(--brass); }
.sheet .hint { margin: 7px 0 12px; }
.plan-list { display: grid; gap: 8px; }
.plan { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; min-height: 70px; padding: 10px 12px; border: 1px solid var(--line); background: #191512; text-align: left; }
.plan[aria-pressed="true"] { background: #3a2b20; border-color: var(--brass); }
.plan strong { font-family: var(--serif); }
.plan small { grid-column: 1 / 3; color: var(--muted); }
.plan .price { font-size: 18px; color: var(--brass); }
.checkout-action { width: 100%; margin-top: 12px; }
.sheet .status { min-height: 1.5em; margin: 9px 0 0; font-size: 13px; color: var(--brass); }
.preview-tools { margin-top: 9px; color: var(--muted); font-size: 12px; }
.preview-tools summary { cursor: pointer; }
.media { width: min(100%, 306px); margin: 7px auto; border: 1px solid #675540; -webkit-touch-callout: default; user-select: auto; }
.sheet .standalone { margin: 10px 0 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

@media (max-width: 700px) {
  .frame { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
  .masthead { min-height: 57px; }
  .footer { min-height: 43px; }
  .hero { grid-template-columns: 1fr; gap: 11px; padding: 16px 0 27px; justify-items: center; align-content: center; }
  .hero-art { grid-row: 1; width: min(60vw, 31vh, 255px); }
  .hero-content { width: min(100%, 430px); }
  .hero h1 { margin: 10px 0 10px; font-size: clamp(40px, 11vw, 54px); }
  .hero .invocation { margin-top: 10px; font-size: 15px; }
  .hero .lead { font-size: 13px; line-height: 1.75; }
  .facts { margin: 15px 0 11px; }
  .hero .primary { width: 100%; }
  .quiz { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 7px 0 12px; }
  .quiz-art { margin: 0 auto; width: min(38vw, 19vh, 161px); }
  .quiz-stage { width: min(100%, 470px); margin: 0 auto; }
  .progress-label { margin-bottom: 6px; }
  .segments { margin-bottom: 13px; }
  .options { margin-top: 13px; gap: 6px; }
  .choice { padding: 8px 10px; min-height: 44px; }
  .quiz-meta { margin-top: 2px; }
  .result { padding-top: 16px; }
  .result-card { grid-template-columns: 1fr; gap: 1px; padding: 15px 17px 19px; }
  .result-art { grid-row: 1; width: min(52vw, 192px); margin: 0 auto; }
  .overlay { align-items: end; padding: 9px 9px max(9px, env(safe-area-inset-bottom)); }
  .sheet { padding: 16px; }
}
@media (max-width: 350px) {
  .frame { padding-inline: 13px; }
  .masthead-side { letter-spacing: 0; }
  .choice { font-size: 13px; }
  .facts { gap: 4px 8px; }
  .facts span + span::before { margin-right: 8px; }
}
@media (max-width: 700px) and (max-height: 680px) {
  .hero-art { width: min(51vw, 25vh, 210px); }
  .quiz-art { width: min(34vw, 15vh, 135px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

.sigil-astrolabe,
.sigil-collapse,
.sigil-wax {
  display: block;
  width: 100%;
  height: auto;
}

.sigil-astrolabe {
  overflow: visible;
}

.sigil-marker {
  transition: fill 240ms ease, fill-opacity 240ms ease, stroke-opacity 320ms ease;
}

.sigil-marker.is-lit {
  filter: drop-shadow(0 0 3px rgba(225, 184, 120, .34));
}

.sigil-texture {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  opacity: .19;
  mix-blend-mode: soft-light;
  pointer-events: none;
}

.sigil-wax {
  overflow: visible;
  filter: drop-shadow(0 4px 8px rgba(6, 3, 4, .54));
}

.sigil-wax-piece {
  transform-box: view-box;
  transform-origin: 50% 50%;
}

.is-shattered .sigil-wax-piece {
  animation: sigil-wax-shatter 760ms cubic-bezier(.2, .72, .3, 1) both;
}

@keyframes sigil-wax-shatter {
  0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
  15%  { opacity: 1; }
  100% { transform: translate(var(--wax-x), var(--wax-y)) rotate(var(--wax-r)); opacity: 0; }
}

.sigil-calc-rings,
.sigil-calc-matrix,
.sigil-calc-flare {
  transform-box: view-box;
  transform-origin: 50% 50%;
}

.sigil-calc-rings {
  animation: sigil-calc-rings 4s ease-in-out both;
}

.sigil-calc-matrix {
  animation: sigil-calc-spin 4s cubic-bezier(.3, .03, .45, 1) both;
}

.sigil-calc-node {
  transform-box: fill-box;
  transform-origin: center;
  animation: sigil-calc-node 3400ms var(--calc-delay) ease-in-out both;
}

.sigil-calc-flare {
  animation: sigil-calc-flare 4s ease-in-out both;
}

@keyframes sigil-calc-rings {
  0%   { transform: scale(.84) rotate(-14deg); opacity: .22; }
  45%  { transform: scale(1) rotate(18deg); opacity: .62; }
  82%  { transform: scale(.54) rotate(88deg); opacity: .42; }
  95%  { transform: scale(1.06) rotate(101deg); opacity: .24; }
  100% { transform: scale(1.16) rotate(105deg); opacity: 0; }
}

@keyframes sigil-calc-spin {
  0%   { transform: rotate(-25deg); }
  50%  { transform: rotate(0deg); }
  100% { transform: rotate(96deg); }
}

@keyframes sigil-calc-node {
  0%   { transform: scale(.4); opacity: .16; }
  27%  { transform: scale(1); opacity: .9; }
  52%  { transform: scale(.78); opacity: .62; }
  100% { transform: translate(var(--calc-x), var(--calc-y)) scale(.06); opacity: 0; }
}

@keyframes sigil-calc-flare {
  0%, 69% { transform: scale(.08); opacity: 0; }
  87%     { transform: scale(.65); opacity: .94; }
  100%    { transform: scale(.35); opacity: .52; }
}

@media (prefers-reduced-motion: reduce) {
  .sigil-marker {
    transition: none;
  }

  .is-shattered .sigil-wax-piece {
    animation: none;
    opacity: 0;
  }

  .sigil-calc-rings,
  .sigil-calc-matrix,
  .sigil-calc-node,
  .sigil-calc-flare {
    animation: none;
  }

  .sigil-calc-rings,
  .sigil-calc-matrix {
    opacity: .38;
  }

  .sigil-calc-flare {
    transform: scale(.35);
    opacity: .55;
  }
}
</style>

  <script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var CENTER = 240;
  var CREAM = "#f2e1ba";
  var BRASS = "#cbb78a";
  var RUST = "#b76a51";
  var SERIF = '"Noto Serif SC","Songti SC","STSong","SimSun",serif';
  var SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
  var sigil;
  var nextId = 0;

  function clamp(value, low, high) {
    return Math.min(high, Math.max(low, value));
  }

  function point(radius, theta) {
    return [
      (CENTER + radius * Math.sin(theta)).toFixed(2),
      (CENTER - radius * Math.cos(theta)).toFixed(2)
    ].join(" ");
  }

  function glyph(index, phase, variant) {
    var sector = Math.floor(index / 8);
    var slot = index % 8;
    var angle = TAU * (sector * 8.6 + slot + 0.8) / 68.8;
    var axis = phase * Math.PI / 8 + variant * TAU / 64;
    var wave = Math.cos(8 * (angle + axis / 4));
    var radius = 182 + (Math.min(phase, 4) * 3.4) * wave;
    var width = 0.016 + (0.006 * (1 + Math.sin(phase + angle * 4)));
    var height = 10 + 7 * Math.cos(phase * 0.55 + slot * Math.PI / 7);
    return "M" + point(radius + height, angle + 0.015 * Math.sin(axis)) +
      " L" + point(radius, angle + width) +
      " L" + point(radius - height, angle - 0.012 * Math.sin(axis)) +
      " L" + point(radius, angle - width) + " Z";
  }

  function weave(phase, variant, offset) {
    var points = [];
    var angle = phase * TAU / 32 + variant * TAU / 64 + offset;
    var high = 148 - 19 * (0.5 + 0.5 * Math.sin(phase * 0.8 + variant * 0.3));
    var low = 66 + 38 * (0.5 + 0.5 * Math.cos(phase * 0.9 + variant * 0.4));
    for (var i = 0; i < 16; i += 1) {
      points.push(point(i % 2 ? low : high, angle + i * TAU / 16));
    }
    return "M" + points.join(" L") + " Z";
  }

  function thread(phase, variant, inner) {
    var lines = [];
    var rotation = phase * TAU / 30 + variant * TAU / 64;
    var reach = inner ? 66 : 122;
    var span = inner ? 2.5 : 3.35;
    for (var i = 0; i < 8; i += 1) {
      var angle = rotation + i * TAU / 8;
      lines.push("M" + point(reach, angle) + " Q" +
        point(10 + 4 * phase, angle + span / 2) + " " +
        point(reach, angle + span));
    }
    return lines.join(" ");
  }

  function rings() {
    var ticks = [];
    for (var i = 0; i < 8; i += 1) {
      var angle = i * TAU / 8;
      ticks.push(
        '<line x1="' + point(214, angle).replace(" ", '" y1="') +
        '" x2="' + point(225, angle).replace(" ", '" y2="') +
        '" stroke-width="' + (i % 2 ? 1 : 1.8) + '"/>'
      );
    }
    return '<g fill="none" stroke="' + BRASS + '" opacity=".42">' +
      '<circle cx="240" cy="240" r="216" stroke-width=".65"/>' +
      '<circle cx="240" cy="240" r="208" stroke-width="1"/>' +
      '<circle cx="240" cy="240" r="200" stroke-width=".6" stroke-dasharray="1 6"/>' +
      '<circle cx="240" cy="240" r="156" stroke-width=".65" opacity=".65"/>' +
      ticks.join("") + '</g>';
  }

  function markers(answered, phase, variant) {
    var nodes = [];
    for (var i = 0; i < 64; i += 1) {
      var lit = i < answered;
      nodes.push('<path data-sigil-node="' + (i + 1) +
        '" class="sigil-marker' + (lit ? ' is-lit' : '') +
        '" d="' + glyph(i, phase, variant) +
        '" fill="' + (lit ? (i % 8 === 7 ? CREAM : BRASS) : "transparent") +
        '" fill-opacity="' + (lit ? "0.86" : "0") +
        '" stroke="' + (lit ? CREAM : BRASS) +
        '" stroke-opacity="' + (lit ? "0.9" : "0.32") + '" stroke-width=".75"/>');
    }
    return nodes.join("");
  }

  function badge(answered, variant) {
    var count = answered === undefined ? 64 : Math.trunc(clamp(Number(answered) || 0, 0, 64));
    var index = Math.trunc(clamp(Number(variant) || 0, 0, 7));
    var phase = Math.floor(count / 8);
    var id = "sigil-halo-" + (++nextId);

          headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
          credentials: 'same-origin',
          cache: 'no-store',
          redirect: 'error',
          signal: controller ? controller.signal : undefined,
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          if (accepted && accepted.includes(response.status)) return {state: 'unauthorized'};
          throw new PaymentError('收银台暂不可用，请稍后重试。');
        }
        return response.json();
      })();
      let timer;
      const timeout = new Promise((resolve, reject) => {
        timer = global.setTimeout(() => {
          if (controller) controller.abort();
          reject(new PaymentError('网络等待超时，订单可稍后继续核验。'));
        }, 7500);
      });
      try {
        return await Promise.race([fetchResult, timeout]);
      } finally {
        global.clearTimeout(timer);
      }
    }

    async loadUnlocked(context, record) {
      if (!record || !validPlan(record.plan) || !validServerToken(record.value)) return null;
      const receipt = await this.request('content', {
        profileId: context.profileId, factionId: context.factionId, unlockToken: record.value
      }, [401, 403, 404, 410]);
      if (receipt && receipt.state === 'unauthorized') {
        const latest = this.read(TOKEN_KEY, context);
        if (latest && latest.value === record.value) this.write(TOKEN_KEY, context, null);
        return null;
      }
      if (!receipt || receipt.state !== 'unlocked' || !validPlan(receipt.plan) ||
          !includesPlan(receipt.plan, record.plan) || receipt.profileId !== context.profileId ||
          receipt.factionId !== context.factionId) {
        throw new PaymentError('档案权益暂未确认，请稍后重新核验。');
      }
      const content = await decryptPayload(receipt.envelope, context, receipt.plan);
      return this.update(context, 'unlocked', '档案已开启。', {plan: receipt.plan, content});
    }

    async fulfill(context, response, pending) {
      if (!response || response.state !== 'paid' || !validPlan(response.plan) ||
          !validServerToken(response.unlockToken) || response.profileId !== context.profileId ||
          response.factionId !== context.factionId ||
          (pending && !includesPlan(response.plan, pending.plan))) {
        throw new PaymentError('订单权益暂未确认，请稍后重新核验。');
      }
      const record = {plan: response.plan, value: response.unlockToken};
      this.write(TOKEN_KEY, context, record);
      const unlocked = await this.loadUnlocked(context, record);
      if (!unlocked) throw new PaymentError('支付已核验，档案凭证仍待签发。请稍后重新核验。');
      this.clearPending(context, pending);
      return Object.assign({}, unlocked, {fulfilledNow: true});
    }

    pending(context) {
      const saved = this.read(PENDING_KEY, context);
      return saved && validPlan(saved.plan) && typeof saved.requestId === 'string' &&
        ORDER_ID.test(saved.requestId) && (!saved.orderId ||
        (typeof saved.orderId === 'string' && ORDER_ID.test(saved.orderId))) ? saved : null;
    }

    clearPending(context, pending) {
      const current = this.pending(context);
      if (pending && current && current.requestId === pending.requestId) {
        this.write(PENDING_KEY, context, null);
      }
    }

    async check(context, pending, delays, pendingMessage) {
      const details = {orderId: pending.orderId, plan: pending.plan};
      this.update(context, 'checking', '正在核验支付状态…', details);
      for (const delay of delays) {
        if (delay) await new Promise(resolve => global.setTimeout(resolve, delay));
        const response = await this.request('orders/status', {
          orderId: pending.orderId || null,
          requestId: pending.requestId,
          profileId: context.profileId,
          factionId: context.factionId
        });
        if (!response || typeof response.state !== 'string') {
          throw new PaymentError('订单状态暂未同步，请稍后重新核验。');
        }
        if (response.state === 'paid') return this.fulfill(context, response, pending);
        if (response.state === 'closed') {
          this.clearPending(context, pending);
          return this.update(context, 'closed', '这笔订单已关闭，可以重新开启收银台。', details);
        }
        if (response.state !== 'pending') throw new PaymentError('订单状态暂未同步，请稍后重新核验。');
        if (document.hidden) break;
      }
      return this.update(context, 'pending', pendingMessage || '订单等待确认，可以返回此页重新核验。', details);
    }

    buy(context) {
      return this.run('buy', context, async () => {
        const plan = context.plan;
        if (!validPlan(plan)) throw new PaymentError('请选择有效的档案版本。');
        if (this.previewEnabled) {
          return this.update(context, 'preview', '本地预览，请使用预览入口体验解封。', {plan});
        }

        let pending = this.pending(context);
        if (pending && pending.plan !== plan) {
          const previous = await this.check(context, pending, [0], '上一笔订单仍待确认，请先完成或核验。');
          if (previous.state === 'pending' ||
              (previous.state === 'unlocked' && includesPlan(previous.plan, plan))) return previous;
          pending = null;
        }
        if (!pending) {
          pending = {plan, requestId: randomId(), orderId: null};
          this.write(PENDING_KEY, context, pending);
        }

        this.update(context, 'creating', '正在开启收银台…', {plan});
        const response = await this.request('orders', {
          profileId: context.profileId, factionId: context.factionId, plan,
          requestId: pending.requestId
        });
        if (response && response.state === 'paid') return this.fulfill(context, response, pending);
        if (response && response.state === 'closed') {
          this.clearPending(context, pending);
          return this.update(context, 'closed', '这笔订单已关闭，请重新开启收银台。', {plan});
        }
        if (!response || response.state !== 'pending' || response.plan !== plan ||
            typeof response.orderId !== 'string' || !ORDER_ID.test(response.orderId) ||
            (pending.orderId && pending.orderId !== response.orderId) ||
            (response.amountFen !== PLANS[plan] && !(plan === 'archive' && response.amountFen === 1000))) {
          throw new PaymentError('收银台订单暂未准备好，请稍后重试。');
        }

        pending.orderId = response.orderId;
        this.write(PENDING_KEY, context, pending);
        if (context.expectedAmountFen === 1000 && response.amountFen !== 1000) {
          throw new PaymentError('补差价格暂未准备好，请核对已有订单。');
        }
        const checkout = response.checkout;
        if (checkout && checkout.kind === 'jsapi') {
          this.update(context, 'checkout', '请在微信收银台确认。', {plan, orderId: pending.orderId});
          const result = await invokeJsapi(checkout.params);
          return this.check(context, pending, result === 'ok' || result === 'timeout' ? POLL_DELAYS : [0],
            result === 'cancel' ? '已返回档案页，订单仍可继续核验。' :
              result === 'fail' ? '收银台已返回，可重新核验或继续支付。' : undefined);
        }
        if (checkout && checkout.kind === 'redirect' && typeof checkout.url === 'string') {
          const target = new URL(checkout.url, global.location.href);
          const sameOrigin = target.origin === global.location.origin;
          if (target.username || target.password ||
              (target.protocol !== 'https:' && !(sameOrigin && target.protocol === 'http:' && LOOPBACK.includes(target.hostname))) ||
              (!sameOrigin && !this.redirectOrigins.includes(target.origin))) {
            throw new PaymentError('收银台地址暂不可用，请稍后重试。');
          }
          const result = this.update(context, 'redirecting', '正在前往收银台，完成后请返回本页。', {
            plan, orderId: pending.orderId
          });
          global.location.assign(target.href);
          return result;
        }
        return this.check(context, pending, [0]);
      });
    }

    restore(context) {
      return this.run('restore', context, async () => {
        const record = this.read(TOKEN_KEY, context);
        if (this.previewEnabled) {
          if (record && validPlan(record.plan) && /^preview-[a-f0-9]{32}$/.test(record.value)) {
            return this.preview(context, record);
          }
          return this.update(context, 'locked', '');
        }

        const pending = this.pending(context);
        let pendingChecked = false;
        if (pending && (!record || !includesPlan(record.plan, pending.plan))) {
          const result = await this.check(context, pending, record ? [0] : POLL_DELAYS);
          pendingChecked = true;
          if (result.state === 'unlocked' || !record) return result;
        }
        const unlocked = await this.loadUnlocked(context, record);
        if (unlocked) {
          if (pending && includesPlan(unlocked.plan, pending.plan)) this.clearPending(context, pending);
          return unlocked;
        }
        if (!pendingChecked && pending && this.pending(context)) return this.check(context, pending, POLL_DELAYS);
        return this.update(context, 'locked', '');
      });
    }

    simulate(context) {
      return this.run('simulate', context, async () => {
        if (!this.previewEnabled || !validPlan(context.plan)) return this.update(context, 'locked', '');
        const existing = this.read(TOKEN_KEY, context);
        if (existing && validPlan(existing.plan) && includesPlan(existing.plan, context.plan) &&
            /^preview-[a-f0-9]{32}$/.test(existing.value)) return this.preview(context, existing);
        const record = {plan: context.plan, value: 'preview-' + randomId()};
        return this.preview(context, record);
      });
    }

    async preview(context, record) {
      if (!this.previewEnabled || typeof this.loadPreview !== 'function') {
        return this.update(context, 'locked', '');
      }
      const content = validatePayload(await this.loadPreview({
        factionId: context.factionId, profileId: context.profileId, plan: record.plan, token: record.value
      }), record.plan);
      this.write(TOKEN_KEY, context, record);
      return this.update(context, 'unlocked', '本地档案预览已开启。', {
        plan: record.plan, content, simulated: true
      });
    }
  }

  WeChatPayBridge.PLANS = PLANS;
  global.WeChatPayBridge = WeChatPayBridge;
})(window);

        <p class="kicker eyebrow-line">第${ACT_NUMBERS[chapterIndex]}幕 · 阶段精神显影</p>
        <h2 tabindex="-1">${escapeHtml(chapter.name)}</h2>
        <p>${escapeHtml(chapter.reveal)}</p>
        ${chapterIndex === 7 ? '' : `<p class="next-chapter">下一幕 · ${escapeHtml(QUIZ.chapters[chapterIndex + 1].name)}</p>`}
        <div class="action-row"><button type="button" class="btn primary" data-action="advance">${chapterIndex === 7 ? '开始 64 重演算' : '进入下一幕'} <span aria-hidden="true">→</span></button>
        <button type="button" class="text-btn" data-action="back">返回上一题</button></div>
      </div>`;
      if (chapterIndex === 7) finalRevealTimer = setTimeout(startCompute, 2600);
    } else {
      const question = questions[state.cursor];
      const previous = state.answers[state.cursor];
      pane.innerHTML = `<p class="question-index">第 ${state.cursor + 1} 题</p>
        <h2 class="question" id="question" tabindex="-1">${escapeHtml(question.prompt)}</h2>
        <div class="options" role="group" aria-labelledby="question">${question.options.map((option, i) => `<button type="button" class="choice${previous === i ? ' chosen' : ''}" ${previous === i ? 'aria-pressed="true"' : 'aria-pressed="false"'} data-action="answer" data-index="${i}" data-question="${state.cursor}"><span aria-hidden="true">${'ABCD'[i]}</span><span>${escapeHtml(option.text)}</span></button>`).join('')}</div>
        <div class="quiz-meta">
          <button type="button" class="text-btn" data-action="back">${state.cursor > 0 ? '上一题' : '返回序言'}</button>
          <span class="hint">${saveFailed ? '本机存储不可用' : '进度自动保存'}</span>
        </div>`;
    }
    if (newScreen || (moveFocus && matchMedia('(max-width: 700px)').matches)) goTop();
    if (moveFocus) focusHeading();
  }

  function choose(option, question) {
    if (screen !== 'quiz' || state.reveal !== null || question !== state.cursor || performance.now() < readyForNextAnswer) return;
    if (!Number.isInteger(option) || option < 0 || option > 3) return;
    const chosen = app.querySelector(`[data-question="${question}"][data-index="${option}"]`);
    if (chosen) chosen.classList.add('chosen');
    const wasFrontier = state.cursor >= state.answers.length - 1;
    state.answers[state.cursor] = option;
    state.cursor++;
    if (wasFrontier && state.cursor % 8 === 0) state.reveal = state.cursor / 8 - 1;
    state.scores = scoresFor(state.answers);
    saveProgress();
    clearTimeout(transitionTimer);
    readyForNextAnswer = performance.now() + 185;
    transitionTimer = setTimeout(() => renderQuiz(true), 125);
  }

  function startCompute() {
    if (screen === 'compute') return;
    clearTimeout(finalRevealTimer);
    state.stage = 'compute';
    state.reveal = null;
    saveProgress();
    screen = 'compute';
    headerStatus.textContent = '64 重演算';
    goTop();
    app.innerHTML = `<section class="compute">${Sigil.collapse()}<h1 tabindex="-1">64 重演算</h1><p id="compute-line" role="status">正在收束 64 重思想切片……</p></section>`;
    focusHeading();
    clearTimeout(computeTimer);
    setTimeout(() => {
      const line = document.getElementById('compute-line');
      if (line) line.textContent = '正在剥离你的社会面具……';
    }, 1950);
    computeTimer = setTimeout(() => {
      state.stage = 'result';
      saveProgress();
      showResult(true);
    }, 4000);
  }

  function resultForState() {
    const ranked = factions.map((faction, index) => ({faction, index, score: state.scores[faction.id]}));
    ranked.sort((a, b) => b.score - a.score || a.index - b.index);
    const winner = ranked[0];
    let hash = 2166136261;
    const signature = `${state.seed}:${state.answers.join('')}`;
    for (const character of signature) hash = Math.imul(hash ^ character.charCodeAt(0), 16777619);
    const code = (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
    return {
      ...winner.faction, factionId: winner.faction.id, variant: winner.index,
      id: `64-${code.slice(0, 4)}-${code.slice(4)}`, profileId: `${state.seed}-${code}`
    };
  }

  function showResult(moveFocus) {
    screen = 'result';
    latestResult = resultForState();
    const {name, id, quote, profile, variant} = latestResult;
    headerStatus.textContent = '公开侧写';
    app.innerHTML = `<section class="result">
      <article class="result-card">
        <div>
          <p class="kicker">精神档案 · ${escapeHtml(id)}</p>
          <h1 tabindex="-1">${escapeHtml(name)}</h1>
          <blockquote>「${escapeHtml(quote)}」</blockquote>
          <p class="profile">${escapeHtml(profile)}</p>
        </div>
        <div class="art-orbit result-art" aria-hidden="true">${Sigil.badge(64, variant)}</div>
      </article>
      <div class="action-row result-actions">
        <button type="button" class="btn" data-action="poster">生成分享海报</button>
        ${location.protocol === 'https:' ? '<button type="button" class="btn" data-action="share">复制实验入口</button>' : ''}
      </div>
      <div id="premium-area"></div>
      <div class="result-footer"><button type="button" class="text-btn" data-action="restart">重新开始实验</button></div>
    </section>`;
    grant = null;
    paymentStatus = '';
    renderPremium();
    goTop();
    if (moveFocus) focusHeading();
    restoreWhenReady();
  }

  function renderPremium(shatter = false) {
    const frame = document.getElementById('premium-area');
    if (!frame) return;
    const opened = Boolean(grant);
    const archive = opened && grant.plan === 'archive';
    frame.innerHTML = `<section class="premium${opened ? '' : ' locked'}" aria-labelledby="premium-title">
      <div class="premium-head"><div><p class="kicker">${opened ? '火漆已揭' : '火漆封存'}</p><h2 id="premium-title" tabindex="-1">${archive ? '完整 64 象档案' : '深度精神档案'}</h2></div>
        ${!opened || shatter ? `<div class="seal${shatter ? ' is-shattered' : ''}" aria-hidden="true">${Sigil.wax()}</div>` : ''}</div>
      <div class="modules">${modules.map((title, i) => `<article class="module"><h3>${title}</h3>${opened ? `<p>${escapeHtml(grant.content.modules[i])}</p>` : `<p class="locked-noise" aria-hidden="true">${['ϟ▰··· ░ ▧ ▥ ▦ ░ ∴···▓▒∵··· ▱ ▰ ··· ░▧ ▧ ▥ ▦', '▓·· ∵··· ▱ ▰ ░▧ ∴··· ▧ ▥ ▦ ░ ▦ ░ ∴···▓▒', '∵· ░▧ ▧ ▥ ▦ ░ ∴···▓▒∵··· ▱ ▰ ···ϟ▰··· ░'][i]}</p>`}</article>`).join('')}</div>
      ${archive ? renderArchive() : `<div class="unlock-row"><button type="button" class="btn primary" data-action="checkout">${opened ? '升级完整 64 象档案' : '揭开火漆封印'}</button><span class="hint">${opened ? '升级规则以爱发电页面为准' : '¥9.99 / 月起 · 会员有效期内解锁'}</span></div>`}
      ${archive || pay.previewEnabled ? '' : '<button type="button" class="text-btn" data-action="restore">核对已有订单</button>'}
      <p class="hint" id="result-status" role="status">${escapeHtml(paymentStatus)}</p>
    </section>`;
    if (shatter) {
      const seal = frame.querySelector('.is-shattered');
      if (seal) setTimeout(() => seal.remove(), 1200);
    }
  }

  function renderArchive() {
    const acts = QUIZ.chapters.map((chapter, c) => `<details><summary>第${ACT_NUMBERS[c]}幕 · ${escapeHtml(chapter.name)}</summary><ol start="${c * 8 + 1}">${chapter.questions.map((question, q) => {
      const index = c * 8 + q;
      const answer = question.options[state.answers[index]].text;
      return `<li><strong>${escapeHtml(answer)}</strong><p>${escapeHtml(grant.content.slices[index])}</p></li>`;
    }).join('')}</ol></details>`).join('');
    return `<section class="archive"><h3>64 重抉择回望</h3>${acts}</section>
      <section class="archive"><h3>高清炼金壁纸包</h3><p class="hint">8 张 · 1080 × 1920 · 选择一张预览并保存</p>
      <div class="wall-list">${QUIZ.chapters.map((chapter, i) => `<button type="button" class="btn" data-action="wallpaper" data-index="${i}" aria-label="${escapeHtml(chapter.name)}壁纸">${escapeHtml(chapter.name)}</button>`).join('')}</div></section>`;
  }

  function context() {
    return {factionId: latestResult.factionId, profileId: latestResult.profileId};
  }

  function sayPayment(message) {
    paymentStatus = String(message || '');
    const sheetStatus = sheet.querySelector('#payment-status');
    if (sheetStatus) sheetStatus.textContent = paymentStatus;
    const resultStatus = document.getElementById('result-status');
    if (resultStatus) resultStatus.textContent = paymentStatus;
  }

  function validContent(result) {
    const content = result && result.content;
    const hasText = (value) => typeof value === 'string' && value.trim() !== '';
    return content && ['decode', 'archive'].includes(result.plan) && Array.isArray(content.modules)
      && content.modules.length === 3 && content.modules.every(hasText)
      && (result.plan === 'decode' || (Array.isArray(content.slices) && content.slices.length === 64 && content.slices.every(hasText)));
  }

  function applyGrant(result, animate) {
    if (!validContent(result)) {
      sayPayment('档案载入失败，请核对已有订单。');
      return;
    }
    if (grant && (grant.plan === 'archive' || grant.plan === result.plan)) return;
    const firstUnlock = !grant;
    grant = result;
    if (dialogKind === 'checkout') closeDialog(false);
    sayPayment('');
    renderPremium(animate && firstUnlock);
    announcer.textContent = '精神档案已解锁';
    if (animate) document.getElementById('premium-title').focus({preventScroll: true});
  }

  async function restoreWhenReady(voluntary = false) {
    if (screen !== 'result' || !latestResult || busy || restoreTask || (grant && grant.plan === 'archive')) return;
    const active = latestResult.profileId;
    if (voluntary === true) sayPayment('正在核对订单……');
    restoreTask = Promise.resolve().then(() => pay.restore(context()));
    try {
      const result = await restoreTask;
      if (screen !== 'result' || latestResult.profileId !== active) return;
      if (result && result.state === 'unlocked') applyGrant(result, voluntary === true || result.fulfilledNow === true);
      else if (voluntary === true) sayPayment(result && result.message || '当前档案暂无已确认的订单。');
    } catch {
      if (voluntary === true) sayPayment('暂时无法核对订单，请稍后重试。');
    } finally {
      restoreTask = null;
    }
  }

  function openDialog(kind, title, content) {
    if (overlay.hidden) dialogTrigger = document.activeElement;
    dialogKind = kind;
    dialogSerial++;
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    sheet.innerHTML = `<button type="button" class="close" data-action="close" aria-label="关闭">×</button><h2 id="dialog-title">${escapeHtml(title)}</h2>${content}`;
    sheet.scrollTop = 0;
    sheet.focus({preventScroll: true});
    return dialogSerial;
  }

  function closeDialog(restoreFocus = true) {
    if (overlay.hidden) return;
    overlay.hidden = true;
    dialogKind = '';
    dialogSerial++;
    document.body.style.overflow = '';
    sheet.replaceChildren();
    if (restoreFocus && dialogTrigger && dialogTrigger.isConnected) dialogTrigger.focus({preventScroll: true});
    dialogTrigger = null;
  }

  function openCheckout() {
    openDialog('checkout', '选择会员档位', `
      <p class="hint">在爱发电完成赞助。会员有效期内享有对应权益，具体规则以爱发电页面为准。</p>
      <div class="plan-list">
        <div class="plan"><strong>精神解码</strong><b class="price">¥9.99 / 月</b><small>解锁互动测试的深度内容</small></div>
        <div class="plan"><strong>完整档案</strong><b class="price">¥19.99 / 月</b><small>包含基础权益与高级版功能</small></div>
      </div>
      <a class="btn primary checkout-action" href="https://ifdian.net/a/lomoxyz" target="_blank" rel="noopener noreferrer">前往爱发电选择档位</a>
      <p class="hint">付款后自动核验功能正在接入，当前页面暂不能确认付款或解锁报告。</p>
      ${pay.previewEnabled ? '<details class="preview-tools"><summary>本地预览工具</summary><button type="button" class="text-btn" data-action="simulate" data-plan="decode">模拟基础会员</button>　<button type="button" class="text-btn" data-action="simulate" data-plan="archive">模拟高级会员</button></details>' : ''}`);
  }

  async function executePayment(simulate) {
    if (!simulate || busy || !latestResult || dialogKind !== 'checkout') return;
    busy = true;
    try {
      const result = await pay.simulate({...context(), plan: selectedPlan});
      if (result && result.state === 'unlocked') applyGrant(result, true);
      else sayPayment(result && result.message || '本地预览暂不可用。');
    } catch {
      sayPayment('本地预览暂不可用。');
    } finally {
      busy = false;
    }
  }

  async function openMedia(wallIndex) {
    const wall = Number.isInteger(wallIndex);
    if (!latestResult || (wall && (!grant || grant.plan !== 'archive' || wallIndex < 0 || wallIndex > 7))) return;
    const result = {...latestResult, entryLabel: location.protocol === 'https:' ? location.host + (location.pathname === '/' ? '' : location.pathname) : ''};
    const title = wall ? `${QUIZ.chapters[wallIndex].name} · 高清壁纸` : '分享精神侧写';
    const serial = openDialog('media', title, '<p class="hint" role="status">图像生成中……</p>');
    try {
      const imageUrl = await (wall ? Sigil.wallpaper(result, wallIndex) : Sigil.poster(result));
      if (serial !== dialogSerial) return;
      const hint = sheet.querySelector('.hint');
      hint.textContent = '在微信中可长按图片保存。';
      const image = document.createElement('img');
      image.className = 'media';
      image.alt = wall ? title : `${result.name} · ${result.id} · ${result.quote}`;
      image.src = imageUrl;
      const download = document.createElement('a');
      download.className = 'btn standalone';
      download.href = imageUrl;
      download.download = `${result.id}-${wall ? `wallpaper-${wallIndex + 1}` : 'poster'}.png`;
      download.textContent = '下载 PNG';
      sheet.append(image, download);
    } catch {
      if (serial === dialogSerial) sheet.querySelector('.hint').textContent = '图像生成失败，请关闭后重试。';
    }
  }

  async function shareEntry() {
    const url = new URL(location.href);
    url.search = '?from=poster';
    url.hash = '';
    try {
      await navigator.clipboard.writeText(url.href);
      sayPayment('实验入口已复制。');
    } catch {
      openDialog('link', '实验入口', `<p class="hint">长按此链接复制。</p><p><a href="${escapeHtml(url.href)}">${escapeHtml(url.href)}</a></p>`);
    }
  }

  document.addEventListener('click', (event) => {
    if (event.target === overlay) closeDialog();
    const control = event.target.closest('[data-action]');
    if (!control || control.disabled || (!overlay.hidden && !sheet.contains(control))) return;
    switch (control.dataset.action) {
      case 'start':
        state.started = true;
        saveProgress();
        renderQuiz(true);
        break;
      case 'answer':
        choose(Number(control.dataset.index), Number(control.dataset.question));
        break;
      case 'back':
        clearTimeout(transitionTimer);
        if (state.cursor === 0) {
          state.started = state.answers.length > 0;
          saveProgress();
          renderIntro();
          focusHeading();
        } else {
          state.reveal = null;
          state.cursor--;
          saveProgress();
          renderQuiz(true);
        }
        break;
      case 'advance':
        if (state.cursor === 64) startCompute();
        else {
          state.reveal = null;
          saveProgress();
          renderQuiz(true);
        }
        break;
      case 'poster': openMedia(); break;
      case 'wallpaper': openMedia(Number(control.dataset.index)); break;
      case 'share': shareEntry(); break;
      case 'checkout': openCheckout(); break;
      case 'restore': restoreWhenReady(true); break;
      case 'simulate': selectedPlan = control.dataset.plan; executePayment(true); break;
      case 'close': closeDialog(); break;
      case 'restart':
        if (busy) sayPayment('请等待订单核对结束。');
        else openDialog('restart', '重新开始这次实验？', '<p class="hint">重新开始会清除本机的当前作答和侧写。请先保存你想留下的海报。</p><button type="button" class="btn primary" data-action="confirm-restart">清除作答并返回序言</button>');
        break;
      case 'confirm-restart':
        if (busy) break;
        closeDialog(false);
        latestResult = null;
        grant = null;
        state = newSession();
        saveProgress();
        renderIntro();
        goTop();
        focusHeading();
        break;
    }
  });

  document.addEventListener('keydown', (event) => {
    if (overlay.hidden) return;
    if (event.key === 'Escape') closeDialog();
    if (event.key !== 'Tab') return;
    const focusable = Array.from(sheet.querySelectorAll('button:not(:disabled), a[href], summary')).filter((element) => element.getClientRects().length);
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
      event.preventDefault();
      if (last) last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      if (first) first.focus();
    }
  });

  if (state.stage === 'result') showResult(false);
  else if (state.stage === 'compute') startCompute();
  else if (state.started) renderQuiz();
  else renderIntro();
})();

  </script>
</body>
